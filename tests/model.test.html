<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bhujal Bhavishya model tests</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; color: #173b38; font: 15px/1.6 sans-serif; }
    li { padding: 4px 0; } .pass { color: #176744; } .fail { color: #a33232; }
  </style>
</head>
<body>
  <h1>Groundwater model checks</h1>
  <p id="summary">Running…</p>
  <ol id="test-results"></ol>
  <script type="module">
    import { breakSeriesGaps, calculateExtraRechargeNeeded, calculateHeadroom, calculateReductionNeeded, classifyStage, criticalYearStatusKey, linearRegression, predictYearForDepth, stageOfExtraction, trendMessageKey, yearsToThreshold } from "../js/model.js";
    import { translations } from "../js/i18n.js";
    import { getDistricts, getWells } from "../js/dataSource.js";
    const results = document.querySelector("#test-results");
    const checks = [];
    const near = (actual, expected, tolerance = 0.01) => Math.abs(actual - expected) <= tolerance;
    function check(name, condition) { checks.push({ name, passed: Boolean(condition) }); }

    const districts = await getDistricts();
    const wells = await getWells();
    const porbandar = districts.find(({ district }) => district === "Porbandar");
    const sabarkantha = districts.find(({ district }) => district === "Sabarkantha");
    const vadodara = districts.find(({ district }) => district === "Vadodara");
    const porbandarStage = stageOfExtraction(porbandar.extraction, porbandar.extractableResource);
    const sabarkanthaStage = stageOfExtraction(sabarkantha.extraction, sabarkantha.extractableResource);
    check("Assessment districts load", districts.length === 34);
    const assessmentDistricts = districts.filter(({ rainfall_mm, extractableResource, extraction }) => rainfall_mm !== null || extractableResource !== null || extraction !== null);
    const wellDistricts = new Set(wells.map(({ district }) => district));
    check("Monitoring wells cover every district with assessment data", assessmentDistricts.every(({ district }) => wellDistricts.has(district)));
    check("Multiple stations are available for at least one district", wells.length > wellDistricts.size && wells.some((well) => wells.some((other) => other.district === well.district && other.station_code !== well.station_code)));
    check("Porbandar stage is about 55.0% and Safe", near(porbandarStage, 55.0, 0.1) && classifyStage(porbandarStage) === "Safe");
    check("Sabarkantha stage is about 76.5% and Semi-critical", near(sabarkanthaStage, 76.5, 0.1) && classifyStage(sabarkanthaStage) === "Semi-critical");
    check("70% is Safe", classifyStage(70) === "Safe");
    check("70.1% is Semi-critical", classifyStage(70.1) === "Semi-critical");
    check("90% is Semi-critical", classifyStage(90) === "Semi-critical");
    check("90.1% is Critical", classifyStage(90.1) === "Critical");
    check("100% is Critical", classifyStage(100) === "Critical");
    check("100.1% is Over-exploited", classifyStage(100.1) === "Over-exploited");
    check("Null stage classifies as null", classifyStage(null) === null);
    check("Extractable resource zero returns null", stageOfExtraction(1, 0) === null);
    check("Null or missing stage inputs return null", stageOfExtraction(null, 1) === null && stageOfExtraction(1, null) === null && stageOfExtraction(undefined, 1) === null);
    check("Negative extraction returns null", stageOfExtraction(-1, 1) === null);
    check("Negative resource returns null", stageOfExtraction(1, -1) === null);
    check("Porbandar reaches 70% in about 12.2 years at 2% growth", near(yearsToThreshold(porbandar.extraction, porbandar.extractableResource, 70, 2), 12.2, 0.1));
    check("Zero growth has no threshold time", yearsToThreshold(porbandar.extraction, porbandar.extractableResource, 70, 0) === null);
    check("Sabarkantha is already above 70%", yearsToThreshold(sabarkantha.extraction, sabarkantha.extractableResource, 70, 2) === 0);
    check("Sabarkantha needs about 4957.2 ham less extraction to reach 70%", near(calculateReductionNeeded(sabarkantha.extraction, sabarkantha.extractableResource, 70), 4957.175, 0.001));
    check("Sabarkantha needs about 7081.7 ham more extractable resource to reach 70%", near(calculateExtraRechargeNeeded(sabarkantha.extraction, sabarkantha.extractableResource, 70), 7081.7, 0.06));
    check("Vadodara has about 3628.7 ham of headroom at 70%", near(calculateHeadroom(vadodara.extraction, vadodara.extractableResource, 70), 3628.662, 0.001));
    check("Porbandar needs no change to reach 70%", calculateReductionNeeded(porbandar.extraction, porbandar.extractableResource, 70) === 0 && calculateExtraRechargeNeeded(porbandar.extraction, porbandar.extractableResource, 70) === 0);
    check("What-it-would-take functions return null for missing or invalid inputs", calculateReductionNeeded(null, 1, 70) === null && calculateReductionNeeded(1, null, 70) === null && calculateExtraRechargeNeeded(undefined, 1, 70) === null && calculateExtraRechargeNeeded(1, 1, null) === null);
    check("Headroom returns null for missing inputs", calculateHeadroom(null, 1, 70) === null && calculateHeadroom(1, null, 70) === null);
    const rann = districts.find(({ district }) => district === "Rann and Kutch");
    check("Rann and Kutch assessment values are null", rann.rainfall_mm === null && rann.extractableResource === null && rann.extraction === null);
    const trendPoints = Array.from({ length: 10 }, (_, index) => {
      const year = 2012 + index;
      return { year, depth: 5 + 1.2 * (year - 2012) };
    });
    const trend = linearRegression(trendPoints, 2012);
    check("Linear regression finds the synthetic 1.2 m/year trend", near(trend.slope, 1.2, 0.01) && near(trend.r2, 1, 0.01) && trend.n === 10);
    const knownIntercept = 5 - 1.2 * 2012;
    check("Predicted year at 17 m is about 2022", near(predictYearForDepth(1.2, knownIntercept, 17), 2022, 0.1));
    check("Non-positive trend slope has no predicted year", predictYearForDepth(0, trend.intercept, 17) === null && predictYearForDepth(-1, trend.intercept, 17) === null);
    const shortTrend = linearRegression(trendPoints.slice(0, 4), 2012);
    check("Regression with fewer than five points remains calculable for UI handling", shortTrend.n === 4 && near(shortTrend.slope, 1.2, 0.01));
    check("Regression with fewer than two points returns null", linearRegression(trendPoints.slice(0, 1), 2012) === null);
    const brokenSeries = breakSeriesGaps([{ year: 1995, depth: 4, n: 1 }, { year: 2012, depth: 6, n: 2 }, { year: 2014, depth: 7, n: 1 }]);
    check("Gap-breaking helper inserts a null point across gaps over three years", brokenSeries.some(({ year, depth }) => year === 1996 && depth === null));
    check("Gap-breaking helper does not split gaps of three years or less", !brokenSeries.some(({ year, depth }) => year === 2013 && depth === null));
    check("Negative slope uses the recovering trend message key", trendMessageKey(-0.59) === "recoveringTrend");
    check("Already-reached critical depth uses its own predicted-year wording key", criticalYearStatusKey(1.69, 0.51, true) === "alreadyReachedYear");
    check("Recovering trends and adequately fit flat trends keep the not-applicable wording key", criticalYearStatusKey(-0.59, 0.02, false) === "notApplicable" && criticalYearStatusKey(0.05, 0.51, false) === "notApplicable");
    check("Positive trend with a weak fit has no reliable critical-year key", criticalYearStatusKey(0.35, 0.02, false) === "noReliableTrend");
    check("Non-negative flat slope with a weak fit has no reliable critical-year key", criticalYearStatusKey(0.05, 0.02, false) === "noReliableTrend");
    check("Positive trend with an adequate fit can show a year", criticalYearStatusKey(1.69, 0.51, false) === null && near(predictYearForDepth(1.69, 10 - 1.69 * 2020, 10), 2020, 0.1));
    check("Critical-depth and trend guidance is translated", ["wellDistrictCaveat", "criticalDepthLabel", "criticalDepthAssumption", "criticalDepthPlaceholder", "invalidCriticalDepth", "criticalDepthReached", "alreadyReachedYear", "firstObservedBeyondDepth", "raiseCriticalDepthHint", "criticalDepthLine", "criticalYearLabel", "limitationCriticalAssumption", "limitationForecast", "howWellDifference", "howLimitCriticalDepth"].every((key) => translations.en[key] && translations.gu[key] && translations.hi[key]));
    check("Summary, calculator and explanation strings are translated", ["dataSummaryTitle", "summaryDistrictCoverage", "summaryHighestStage", "summaryDeepening", "summaryMoreWells", "wellSelectLabel", "summaryNoClearTrendMost", "whatItTakesTitle", "calculatorNote", "howItWorksTitle", "howStageMeaning"].every((key) => translations.en[key] && translations.gu[key] && translations.hi[key]));
    check("Hindi has a translation for every English UI key", Object.keys(translations.en).every((key) => Boolean(translations.hi[key])));
    check("English, Gujarati and Hindi include the Hindi language label", translations.en.hindiLanguage === "Hindi" && translations.gu.hindiLanguage === "હિન્દી" && translations.hi.hindiLanguage === "हिन्दी");
    check("Hindi includes district names", translations.hi.districtPorbandar === "पोरबंदर" && translations.hi.districtRannAndKutch);
    const positiveTrendPrediction = predictYearForDepth(1.69, 10 - 1.69 * 2020, 10);
    check("Positive 1.69 slope with R2 0.51 can predict a critical year", 0.51 >= 0.3 && positiveTrendPrediction !== null && near(positiveTrendPrediction, 2020, 0.1));

    checks.forEach(({ name, passed }) => {
      const item = document.createElement("li");
      item.className = passed ? "pass" : "fail";
      item.textContent = `${passed ? "PASS" : "FAIL"}: ${name}`;
      results.append(item);
    });
    const failed = checks.filter(({ passed }) => !passed).length;
    document.querySelector("#summary").textContent = `${checks.length - failed}/${checks.length} checks passed.`;
    document.title = failed ? "FAIL - model tests" : "PASS - model tests";
  </script>
</body>
</html>
